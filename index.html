<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Soccer - Iced Studios</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0e3012; font-family: 'Trebuchet MS', sans-serif; color: white; }
        #game { display: none; width: 100vw; height: 100vh; position: relative; background: #27ae60; border: 10px solid white; box-sizing: border-box; }
        #ball { width: 35px; height: 35px; background: radial-gradient(circle at 30% 30%, #fff, #888); border-radius: 50%; position: absolute; cursor: grab; z-index: 10; border: 2px solid #222; }
        .defender, #goalie { width: 48px; height: 48px; position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 3px solid rgba(0,0,0,0.3); }
        .defender { background: linear-gradient(135deg, #ff4b2b, #ff416c); }
        #goalie { background: linear-gradient(135deg, #f9d423, #ff4e50); width: 55px; height: 55px; }
        #goal { width: 70px; height: 260px; border: 8px solid white; border-right: none; position: absolute; right: 0; top: calc(50% - 130px); background: rgba(255,255,255,0.1); }
        .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        button { padding: 15px 40px; font-size: 1.2rem; cursor: pointer; background: #f1c40f; border: none; border-radius: 50px; font-weight: bold; margin-top: 15px; }
        #ui { position: fixed; top: 20px; left: 30px; z-index: 50; display: flex; gap: 25px; font-size: 1.2rem; font-weight: bold; width: 95%; align-items: center; }
        #leaderboardList { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; width: 300px; margin-top: 20px; }
        .leader-entry { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="ui">
        <div>🏆 LVL: <span id="level">1</span></div>
        <div>⚽ SCORE: <span id="score">0</span></div>
        <div style="color: #f1c40f;">⭐ BEST: <span id="bestScore">0</span></div>
    </div>

    <div id="startScreen" class="screen">
        <h1>AN ICED PRODUCTION</h1>
        <p style="color: #00d4ff; font-weight: bold;">ICED STUDIOS ™</p>
        <button onclick="showNameEntry()">KICK OFF</button>
        <button onclick="showLeaderboard()" style="background: #3498db;">LEADERBOARD</button>
    </div>

    <div id="nameScreen" class="screen" style="display: none;">
        <h1>SELECT YOUR NAME</h1>
        <input type="text" id="usernameInput" placeholder="Your Name" maxlength="10" style="padding: 10px; border-radius: 5px; border: none; font-size: 1.2rem; text-align: center;">
        <button onclick="confirmName()">START MATCH</button>
    </div>

    <div id="leaderboardScreen" class="screen" style="display: none;">
        <h1>GLOBAL TOP SCORES</h1>
        <div id="leaderboardList">Loading...</div>
        <button onclick="closeLeaderboard()">BACK</button>
    </div>

    <div id="retryScreen" class="screen" style="display: none;">
        <h1 style="color: #ff4b2b;">FOUL!</h1>
        <button onclick="retryLevel()">RETRY MATCH</button>
        <button onclick="showLeaderboard()" style="background: #3498db;">VIEW RANKINGS</button>
    </div>

    <div id="game">
        <div id="ball"></div>
        <div id="goalie">GK</div>
        <div id="goal"></div>
    </div>

    <script>
        const ball = document.getElementById("ball"), goal = document.getElementById("goal");
        const scoreText = document.getElementById("score"), bestScoreText = document.getElementById("bestScore");
        const leaderboardList = document.getElementById("leaderboardList"), goalie = document.getElementById("goalie");
        
        let level = 1, score = 0, playerName = "", gameRunning = false, defenders = [], defenderData = [];
        let ballX = 100, ballY = window.innerHeight / 2, prevBallX = 100, prevBallY = window.innerHeight / 2;
        let keys = {}, goalieY = window.innerHeight / 2;

        const API_URL = "https://api.counterapi.dev";

        async function uploadScore(name, val) {
            try { await fetch(`${API_URL}/set?name=${name}&score=${val}`); } catch (e) {}
        }

        async function showLeaderboard() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById("leaderboardScreen").style.display = "flex";
            leaderboardList.innerHTML = "Fetching scores...";
            try {
                leaderboardList.innerHTML = `<div class="leader-entry"><span>1. ${playerName || 'You'}</span><span>${localStorage.getItem("icedBest") || 0}</span></div>`;
            } catch (e) { leaderboardList.innerHTML = "Offline or error."; }
        }

        function showNameEntry() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("nameScreen").style.display = "flex";
        }

        function confirmName() {
            playerName = document.getElementById("usernameInput").value || "Player";
            document.getElementById("nameScreen").style.display = "none";
            startGame();
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardScreen").style.display = "none";
            document.getElementById("startScreen").style.display = "flex";
        }

        function startGame() {
            document.getElementById("game").style.display = "block";
            level = 1; score = 0; scoreText.innerText = "0";
            loadLevel();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function loadLevel() {
            document.getElementById("level").innerText = level;
            defenders.forEach(d => d.remove()); defenders = []; defenderData = [];
            for (let i = 0; i < Math.min(level + 4, 12); i++) {
                let d = document.createElement("div"); d.className = "defender"; d.innerText = "DF";
                let dx = 400 + Math.random() * (window.innerWidth - 600), dy = Math.random() * (window.innerHeight - 50);
                d.style.left = dx + "px"; d.style.top = dy + "px";
                document.getElementById("game").appendChild(d);
                defenders.push(d);
                defenderData.push({ 
                    x: dx, y: dy, 
                    speed: (2 + Math.random() * 2) + (level * 0.2),
                    prediction: 15 + (Math.random() * 25)
                });
            }
            ballX = 100; ballY = window.innerHeight / 2;
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            let velX = ballX - prevBallX;
            let velY = ballY - prevBallY;
            prevBallX = ballX; prevBallY = ballY;

            if (keys["w"] || keys["ArrowUp"]) ballY -= 12;
            if (keys["s"] || keys["ArrowDown"]) ballY += 12;
            if (keys["a"] || keys["ArrowLeft"]) ballX -= 12;
            if (keys["d"] || keys["ArrowRight"]) ballX += 12;
            
            ballX = Math.max(0, Math.min(window.innerWidth - 35, ballX));
            ballY = Math.max(0, Math.min(window.innerHeight - 35, ballY));
            ball.style.left = ballX + "px"; ball.style.top = ballY + "px";

            let gSpeed = 4 + (level * 0.5);
            if (goalieY < ballY - 15) goalieY += gSpeed; else goalieY -= gSpeed;
            goalie.style.left = (window.innerWidth - 130) + "px"; goalie.style.top = goalieY + "px";

            defenders.forEach((d, i) => {
                let data = defenderData[i];
                let targetX = ballX + (velX * data.prediction);
                let targetY = ballY + (velY * data.prediction);
                let dx = targetX - data.x, dy = targetY - data.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 1) {
                    let mx = (dx / dist) * data.speed;
                    let my = (dy / dist) * data.speed;
                    
                    defenders.forEach((other, j) => {
                        if (i === j) return;
                        let od = defenderData[j];
                        let sx = data.x - od.x, sy = data.y - od.y;
                        let sd = Math.sqrt(sx * sx + sy * sy);
                        if (sd < 50) { mx += sx / sd * 0.5; my += sy / sd * 0.5; }
                    });

                    data.x += mx; data.y += my;
                }
                d.style.left = data.x + "px"; d.style.top = data.y + "px";
            });

            let br = ball.getBoundingClientRect();
            [...defenders, goalie].forEach(d => {
                let dr = d.getBoundingClientRect();
                if (br.left < dr.right && br.right > dr.left && br.top < dr.bottom && br.bottom > dr.top) {
                    gameRunning = false;
                    let best = localStorage.getItem("icedBest") || 0;
                    if (score > best) {
                        localStorage.setItem("icedBest", score);
                        uploadScore(playerName, score);
                        bestScoreText.innerText = score;
                    }
                    document.getElementById("retryScreen").style.display = "flex";
                }
            });

            let gr = goal.getBoundingClientRect();
            if (br.left < gr.right && br.right > gr.left && br.top < gr.bottom && br.bottom > gr.top) {
                score += 100; scoreText.innerText = score;
                level++; loadLevel();
            }
            requestAnimationFrame(gameLoop);
        }

        window.onkeydown = e => keys[e.key] = true;
        window.onkeyup = e => keys[e.key] = false;
        function retryLevel() { document.getElementById("retryScreen").style.display = "none"; loadLevel(); gameRunning = true; requestAnimationFrame(gameLoop); }
    </script>
</body>
</html>
